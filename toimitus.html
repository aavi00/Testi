<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Toimituksen työkalu – Sport Lappeenranta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --ink:#101012; --muted:#5C5C66; --line:#DEDEE2;
  --accent:#C9411F; --accent-ink:#FFFFFF;
  --head:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E0E10;--surface:#17171A;--ink:#F2F2F4;--muted:#A0A0AA;--line:#26262B;--accent:#FF6A45;--accent-ink:#0E0E10;color-scheme:dark}
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{width:min(760px,100% - 40px);margin-inline:auto;padding:40px 0 72px}
a{color:inherit}
h1{font:800 clamp(2.2rem,7vw,3.6rem)/1 var(--head);letter-spacing:-.04em;margin:18px 0 12px}
.lead{color:var(--muted);margin:0 0 32px;max-width:54ch}
.tabs{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:500;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:active{transform:scale(.97)}
form{display:grid;gap:22px}
label{display:grid;gap:8px;font-weight:500}
label small{font-weight:400;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{min-height:200px;resize:vertical}
.row{display:grid;gap:22px}
@media (min-width:600px){.row{grid-template-columns:1fr 1fr}}
.btn{justify-self:start;border:0;background:var(--accent);color:var(--accent-ink);font:600 1rem var(--body);padding:14px 28px;border-radius:999px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.out{margin-top:36px;border-top:2px solid var(--ink);padding-top:22px}
.out h2{font:800 1.5rem var(--head);letter-spacing:-.02em;margin:0 0 6px}
.out ol{color:var(--muted);padding-left:1.2em;margin:0 0 16px}
pre{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;overflow:auto;font:400 .85rem/1.5 var(--mono);max-height:340px;white-space:pre-wrap;word-break:break-word}
.err{color:var(--accent);font-weight:500;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="font:500 .85rem var(--mono);color:var(--muted)">Takaisin sivustolle</a>
  <h1>Toimituksen työkalu</h1>
  <p class="lead">Täytä lomake ja kopioi valmis koodi sisältötiedostoon uutiset.js. Tämä sivu ei tallenna mitään, se vain muotoilee tekstin oikeaan muotoon.</p>

  <div class="tabs" role="group" aria-label="Mitä lisäät">
    <button class="tab" data-type="uutinen" aria-pressed="true">Uutinen</button>
    <button class="tab" data-type="tapahtuma" aria-pressed="false">Tapahtuma</button>
    <button class="tab" data-type="tulos" aria-pressed="false">Tulos</button>
  </div>

  <form id="form" novalidate></form>

  <section class="out" id="out" hidden aria-live="polite">
    <h2>Valmis koodi</h2>
    <ol id="steps"></ol>
    <pre id="code"></pre>
    <button class="btn" id="copy" type="button">Kopioi koodi</button>
  </section>
</div>

<script>
(function(){
  var TYPES = {
    uutinen:{
      target:'window.UUTISET = [',
      fields:[
        {k:'otsikko',l:'Otsikko',req:1},
        {row:[{k:'pvm',l:'Päivämäärä',type:'date',req:1},{k:'laji',l:'Laji',req:1,hint:'esim. Jääkiekko'}]},
        {k:'kirjoittaja',l:'Kirjoittaja',hint:'esim. Toimitus'},
        {k:'ingressi',l:'Ingressi',hint:'Yksi tai kaksi lausetta, joka näkyy etusivulla.',area:3},
        {k:'teksti',l:'Jutun teksti',hint:'Jätä kappaleiden väliin tyhjä rivi.',area:9,req:1},
        {k:'kuva',l:'Kuvan tiedostonimi',hint:'Valinnainen. Lataa kuva GitHubiin ja kirjoita tähän sen nimi, esim. ottelu.jpg'}
      ]
    },
    tapahtuma:{
      target:'window.TAPAHTUMAT = [',
      fields:[
        {k:'nimi',l:'Tapahtuman nimi',req:1},
        {row:[{k:'pvm',l:'Päivämäärä',type:'date',req:1},{k:'aika',l:'Kellonaika',hint:'esim. 17.00'}]},
        {row:[{k:'paikka',l:'Paikka'},{k:'laji',l:'Laji',req:1}]}
      ]
    },
    tulos:{
      target:'window.TULOKSET = [',
      fields:[
        {row:[{k:'laji',l:'Laji',req:1},{k:'pvm',l:'Päivämäärä',type:'date',req:1}]},
        {row:[{k:'koti',l:'Kotijoukkue',req:1},{k:'vieras',l:'Vierasjoukkue',req:1}]},
        {k:'tulos',l:'Tulos',hint:'esim. 3–2',req:1}
      ]
    }
  };
  var current = 'uutinen';
  var form = document.getElementById('form');
  var out = document.getElementById('out');

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function field(f){
    var id='f_'+f.k;
    var input = f.area
      ? '<textarea id="'+id+'" name="'+f.k+'" rows="'+f.area+'"></textarea>'
      : '<input id="'+id+'" name="'+f.k+'" type="'+(f.type||'text')+'" autocomplete="off">';
    return '<label for="'+id+'">'+esc(f.l)+(f.req?'':' <small>(valinnainen)</small>')+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+input+'</label>';
  }
  function build(){
    var t = TYPES[current], html='';
    t.fields.forEach(function(f){
      html += f.row ? '<div class="row">'+f.row.map(field).join('')+'</div>' : field(f);
    });
    html += '<p class="err" id="err" hidden></p><button class="btn" type="submit">Luo koodi</button>';
    form.innerHTML = html;
    out.hidden = true;
  }
  function slug(s){
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
  }
  function allFields(){
    var arr=[];TYPES[current].fields.forEach(function(f){(f.row||[f]).forEach(function(x){arr.push(x)})});return arr;
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){
      current=b.dataset.type;
      document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      build();
    });
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var obj={}, missing=[], err=document.getElementById('err');
    allFields().forEach(function(f){
      var v = form.elements[f.k].value.trim();
      if(f.req && !v) missing.push(f.l);
      obj[f.k]=v;
    });
    if(missing.length){err.textContent='Täytä vielä: '+missing.join(', ');err.hidden=false;return}
    err.hidden=true;
    if(current==='uutinen'){
      var o={id:slug(obj.otsikko)+'-'+obj.pvm};
      Object.keys(obj).forEach(function(k){o[k]=obj[k]});
      if(!o.kirjoittaja)o.kirjoittaja='Toimitus';
      obj=o;
    }
    var code = JSON.stringify(obj,null,2).replace(/^/gm,'  ')+',';
    document.getElementById('code').textContent = code;
    document.getElementById('steps').innerHTML =
      '<li>Paina "Kopioi koodi".</li>'+
      '<li>Avaa GitHubissa tiedosto <b>uutiset.js</b> ja paina kynä-kuvaketta.</li>'+
      '<li>Etsi rivi <b>'+esc(TYPES[current].target)+'</b> ja liitä koodi sen alle uudelle riville.</li>'+
      '<li>Paina <b>Commit changes</b>. Sivu päivittyy minuutissa.</li>';
    out.hidden=false;
    out.scrollIntoView({behavior:'smooth',block:'start'});
  });

  document.getElementById('copy').addEventListener('click',function(){
    var btn=this, text=document.getElementById('code').textContent;
    function done(){btn.textContent='Kopioitu';setTimeout(function(){btn.textContent='Kopioi koodi'},1800)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){sel()})}else sel();
    function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('code'));var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Valittu, kopioi käsin'}
  });

  build();
})();
</script>
</body>
</html>
