<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Lappeenranta – paikalliset urheilu-uutiset</title>
<meta name="description" content="Uutisia, tuloksia ja tapahtumia Lappeenrannan urheilusta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --ink:#101012; --muted:#5C5C66; --line:#DEDEE2;
  --accent:#C9411F; --accent-ink:#FFFFFF; --ph:#E9E9EC; --stroke:#B9B9C0; --stripe:rgba(0,0,0,.05);
  --head:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --surface:#17171A; --ink:#F2F2F4; --muted:#A0A0AA; --line:#26262B;
    --accent:#FF6A45; --accent-ink:#0E0E10; --ph:#1A1A1E; --stroke:#3A3A42; --stripe:rgba(255,255,255,.04);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{outline:none;min-height:60dvh}

/* Header */
.top{padding:22px 0 0}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.mark{font:800 clamp(1.7rem,4.6vw,2.6rem)/1 var(--head);letter-spacing:-.04em}
.mark i{font-style:normal;color:var(--accent);margin:0 .06em}
.tagline{font:400 .8rem var(--mono);color:var(--muted);letter-spacing:.02em}
.sports{display:flex;gap:8px;overflow-x:auto;padding:18px 0 16px;margin:0;list-style:none;scrollbar-width:none}
.sports::-webkit-scrollbar{display:none}
.chip{display:inline-block;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:500;font-size:.92rem;background:var(--surface);transition:transform .12s,background .15s,color .15s}
.chip:hover{border-color:var(--ink)}
.chip:active{transform:scale(.97)}
.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Results ticker */
.ticker{background:var(--ink);color:var(--bg);overflow:hidden;font:500 .82rem var(--mono)}
.ticker-track{display:flex;width:max-content;animation:run 38s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{padding:10px 26px;white-space:nowrap}
.ticker b{color:var(--accent);font-weight:500;margin-right:10px}
.ticker em{font-style:normal;margin:0 8px;color:var(--accent)}
@keyframes run{to{transform:translateX(-50%)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ticker{background:var(--surface);color:var(--ink)}}

/* Shared bits */
.meta{display:flex;align-items:center;gap:12px;margin:0 0 10px;font:400 .8rem var(--mono);color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 10px;font:500 .72rem var(--mono);letter-spacing:.03em;white-space:nowrap}
.media{position:relative;aspect-ratio:16/10;background:var(--ph);overflow:hidden;border-radius:4px}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
a:hover .media img{transform:scale(1.035)}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px 18px;background:repeating-linear-gradient(135deg,transparent 0 14px,var(--stripe) 14px 15px)}
.ph span{font:800 clamp(2.2rem,7vw,5rem)/.9 var(--head);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px var(--stroke)}
h2.sec{font:800 clamp(1.7rem,3.6vw,2.4rem)/1.05 var(--head);letter-spacing:-.03em;margin:0}

/* Reveal */
.rv{animation:up .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Front page top */
.topgrid{display:grid;gap:clamp(32px,5vw,72px);padding:clamp(28px,4vw,52px) 0 clamp(48px,7vw,96px)}
@media (min-width:960px){.topgrid{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}}
.lead .media{aspect-ratio:16/10}
.lead-head{position:relative;margin:-2.4rem 9% 0 0;padding:1.2rem 1.4rem 0 0;background:var(--bg)}
@media (max-width:600px){.lead-head{margin-right:0;padding-right:0;margin-top:-1.4rem}}
.lead h2{font:800 clamp(2rem,4.8vw,3.7rem)/1.02 var(--head);letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.lead a:hover h2{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--accent)}
.lead .ing{margin:0;color:var(--muted);max-width:52ch}

.latest{border-top:2px solid var(--ink);padding-top:14px}
.latest h2{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:var(--muted)}
.latest ol{list-style:none;margin:0;padding:0}
.latest li{border-bottom:1px solid var(--line)}
.latest a{display:grid;gap:6px;padding:18px 0}
.latest a strong{font:700 1.2rem/1.25 var(--head);letter-spacing:-.015em}
.latest a:hover strong{color:var(--accent)}
.latest a:active{transform:translateY(1px)}

/* Events */
.events{border-top:1px solid var(--line);padding:clamp(48px,7vw,96px) 0}
.split{display:grid;gap:32px}
@media (min-width:900px){.split{grid-template-columns:1fr 2fr;gap:80px}.split>div:first-child{position:sticky;top:24px;align-self:start}}
.split p.lead-text{color:var(--muted);max-width:30ch;margin:14px 0 0}
.evlist{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:8px 24px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.ev .date{display:flex;flex-direction:column;align-items:center;min-width:64px;font:500 .72rem var(--mono);text-transform:uppercase;color:var(--muted)}
.ev .date b{font:800 2.6rem/1 var(--head);letter-spacing:-.04em;color:var(--ink)}
.ev h3{margin:0;font:700 1.25rem/1.25 var(--head);letter-spacing:-.015em}
.ev p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
@media (max-width:560px){.ev{grid-template-columns:auto 1fr}.ev .tag{grid-column:2;justify-self:start}}

/* More stories grid */
.more{border-top:1px solid var(--line);padding:clamp(48px,7vw,96px) 0}
.more-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px;gap:16px}
.grid{display:grid;gap:44px 32px;grid-template-columns:1fr}
@media (min-width:800px){
  .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .grid>article{grid-column:span 4}
  .grid>article:nth-child(5n+1){grid-column:span 7}
  .grid>article:nth-child(5n+2){grid-column:span 5}
  .grid>article:nth-child(5n+1) .media{aspect-ratio:16/9}
  .grid>article:nth-child(5n+2) .media{aspect-ratio:4/3}
  .grid>article:nth-child(n+3):nth-child(-n+5) .media{aspect-ratio:1/1}
}
.grid article a{display:block}
.grid article a:active{transform:translateY(1px)}
.grid .media{margin-bottom:16px}
.grid h3{font:700 clamp(1.25rem,2.4vw,1.6rem)/1.15 var(--head);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.grid a:hover h3{color:var(--accent)}
.grid p.ing{margin:0;color:var(--muted);font-size:.98rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Sport page heading */
.pagehead{padding:clamp(36px,6vw,72px) 0 12px}
.pagehead h1{font:800 clamp(3rem,10vw,8rem)/.9 var(--head);letter-spacing:-.05em;margin:0}
.pagehead p{color:var(--muted);margin:14px 0 0}

/* Article */
.story{padding:clamp(28px,4vw,56px) 0 clamp(56px,8vw,112px);display:grid;gap:32px}
@media (min-width:960px){.story{grid-template-columns:220px minmax(0,1fr);gap:72px}.story aside{position:sticky;top:24px;align-self:start}}
.back{display:inline-flex;gap:8px;align-items:center;font:500 .85rem var(--mono);color:var(--muted);margin-bottom:22px}
.back::before{content:"";width:18px;height:1.5px;background:currentColor}
.back:hover{color:var(--accent)}
.story aside dl{margin:0;display:grid;gap:14px;font-size:.95rem}
.story aside dt{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.story aside dd{margin:2px 0 0}
.story h1{font:800 clamp(2.2rem,6vw,4.6rem)/1 var(--head);letter-spacing:-.04em;margin:0 0 22px;text-wrap:balance;max-width:16ch}
.story .ing{font-size:clamp(1.2rem,2.2vw,1.5rem);line-height:1.45;color:var(--muted);max-width:44ch;margin:0 0 36px}
.story .media{margin-bottom:40px;aspect-ratio:16/9}
.body p{font-size:1.15rem;line-height:1.75;max-width:62ch;margin:0 0 1.2em}

.empty{border:1px dashed var(--line);border-radius:6px;padding:40px 28px;color:var(--muted);max-width:52ch}
.empty h3{margin:0 0 8px;color:var(--ink);font:700 1.3rem var(--head)}
.empty p{margin:0}

footer{border-top:1px solid var(--line);padding:40px 0 56px;margin-top:24px}
footer .wrap{display:grid;gap:12px}
@media (min-width:800px){footer .wrap{grid-template-columns:1fr auto;align-items:end}}
footer p{margin:0;color:var(--muted)}
footer a.mail{font:700 clamp(1.3rem,3vw,1.9rem)/1.1 var(--head);letter-spacing:-.02em;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:6px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{animation:none}
  .ticker{overflow-x:auto}
  .ticker-track{animation:none}
  .media img{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="mark" href="#/" aria-label="Sport Lappeenranta, etusivu">Sport<i>/</i>Lappeenranta</a>
      <span class="tagline">Paikalliset urheilu-uutiset</span>
    </div>
    <ul class="sports" id="sports" aria-label="Lajit"></ul>
  </div>
</header>

<div class="ticker" id="ticker" aria-label="Tuoreimmat tulokset" hidden></div>

<main id="main" tabindex="-1"><noscript><div class="wrap"><p>Sivu vaatii JavaScriptin toimiakseen.</p></div></noscript></main>

<footer>
  <div class="wrap">
    <div>
      <p>Onko sinulla vinkki tai tapahtuma, josta pitäisi kertoa?</p>
      <a class="mail" href="mailto:toimitus@esimerkki.fi">toimitus@esimerkki.fi</a>
    </div>
    <p>© 2026 Sport Lappeenranta</p>
  </div>
</footer>

<script src="uutiset.js"></script>
<script>
(function(){
  var main = document.getElementById('main');
  var SITE = 'Sport Lappeenranta';
  var MONTHS = ['tammi','helmi','maalis','huhti','touko','kesä','heinä','elo','syys','loka','marras','joulu'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function fmt(iso){var p=String(iso).split('-');return (+p[2])+'.'+(+p[1])+'.'+p[0]}
  function short(iso){var p=String(iso).split('-');return (+p[2])+'.'+(+p[1])+'.'}
  function today(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
  function byDateDesc(a,b){return a.pvm<b.pvm?1:a.pvm>b.pvm?-1:0}

  var NEWS = (window.UUTISET||[]).slice().sort(byDateDesc);
  var EVENTS = (window.TAPAHTUMAT||[]).slice().sort(function(a,b){return a.pvm>b.pvm?1:-1});
  var RESULTS = (window.TULOKSET||[]).slice().sort(byDateDesc).slice(0,12);

  function sportsList(){
    var set = {};
    NEWS.forEach(function(a){if(a.laji)set[a.laji]=1});
    EVENTS.forEach(function(e){if(e.laji)set[e.laji]=1});
    return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'fi')});
  }

  function media(a){
    if(a.kuva) return '<div class="media"><img src="'+esc(a.kuva)+'" alt="" loading="lazy"></div>';
    return '<div class="media"><div class="ph" aria-hidden="true"><span>'+esc(a.laji)+'</span></div></div>';
  }

  function renderNav(active){
    var items = ['<li><a class="chip" href="#/"'+(active?'':' aria-current="page"')+'>Kaikki</a></li>'];
    sportsList().forEach(function(s){
      items.push('<li><a class="chip" href="#/laji/'+encodeURIComponent(s)+'"'+(active===s?' aria-current="page"':'')+'>'+esc(s)+'</a></li>');
    });
    document.getElementById('sports').innerHTML = items.join('');
  }

  function renderTicker(){
    var el = document.getElementById('ticker');
    if(!RESULTS.length){el.hidden=true;return}
    var row = RESULTS.map(function(r){
      return '<span><b>'+esc(r.laji).toUpperCase()+'</b>'+esc(r.koti)+'<em>'+esc(r.tulos)+'</em>'+esc(r.vieras)+'</span>';
    }).join('');
    el.innerHTML = '<div class="ticker-track">'+row+row+'</div>';
    el.hidden = false;
  }

  function latestItem(a,i){
    return '<li class="rv" style="--i:'+(i+2)+'"><a href="#/juttu/'+esc(a.id)+'"><div class="meta"><span class="tag">'+esc(a.laji)+'</span><time>'+short(a.pvm)+'</time></div><strong>'+esc(a.otsikko)+'</strong></a></li>';
  }

  function gridItem(a,i){
    return '<article class="rv" style="--i:'+(i%5)+'"><a href="#/juttu/'+esc(a.id)+'">'+media(a)+'<div class="meta"><span class="tag">'+esc(a.laji)+'</span><time>'+fmt(a.pvm)+'</time></div><h3>'+esc(a.otsikko)+'</h3><p class="ing">'+esc(a.ingressi)+'</p></a></article>';
  }

  function eventsBlock(sport){
    var t = today();
    var list = EVENTS.filter(function(e){return e.pvm>=t && (!sport||e.laji===sport)});
    var rows;
    if(!list.length){
      rows = '<div class="empty"><h3>Ei tulevia tapahtumia</h3><p>Uudet tapahtumat ilmestyvät tähän, kun ne on lisätty.</p></div>';
    } else {
      rows = '<ul class="evlist">'+list.map(function(e){
        var p = e.pvm.split('-');
        return '<li class="ev"><div class="date"><b>'+(+p[2])+'</b><span>'+MONTHS[+p[1]-1]+'</span></div><div><h3>'+esc(e.nimi)+'</h3><p>'+esc([e.aika,e.paikka].filter(Boolean).join(' · '))+'</p></div><span class="tag">'+esc(e.laji)+'</span></li>';
      }).join('')+'</ul>';
    }
    return '<section class="events"><div class="wrap split"><div><h2 class="sec">Tulevat tapahtumat</h2><p class="lead-text">Ottelut, kilpailut ja muut tapahtumat Lappeenrannassa.</p></div><div>'+rows+'</div></div></section>';
  }

  function home(sport){
    var list = sport ? NEWS.filter(function(a){return a.laji===sport}) : NEWS;
    renderNav(sport||null);
    document.title = sport ? sport+' – '+SITE : SITE+' – paikalliset urheilu-uutiset';
    var html = '';

    if(!list.length){
      html += '<div class="wrap">'+(sport?'<div class="pagehead"><h1>'+esc(sport)+'</h1></div>':'<h1 class="sr">'+SITE+'</h1>')+
        '<div class="empty" style="margin:32px 0 64px"><h3>Ei vielä uutisia</h3><p>Tähän lajiin ei ole vielä lisätty juttuja. Palaa pian.</p></div></div>';
      html += eventsBlock(sport);
      main.innerHTML = html;
      return;
    }

    var lead = list[0], latest = list.slice(1,5), rest = list.slice(5);

    html += '<div class="wrap">';
    if(sport){
      html += '<div class="pagehead rv"><h1>'+esc(sport)+'</h1><p>'+list.length+' '+(list.length===1?'juttu':'juttua')+'</p></div>';
    } else {
      html += '<h1 class="sr">'+SITE+' – uutiset</h1>';
    }
    html += '<div class="topgrid">'+
      '<article class="lead rv" style="--i:1"><a href="#/juttu/'+esc(lead.id)+'">'+media(lead)+
      '<div class="lead-head"><div class="meta"><span class="tag">'+esc(lead.laji)+'</span><time>'+fmt(lead.pvm)+'</time></div>'+
      '<h2>'+esc(lead.otsikko)+'</h2><p class="ing">'+esc(lead.ingressi)+'</p></div></a></article>';
    if(latest.length){
      html += '<aside class="latest rv" style="--i:2"><h2>Tuoreimmat</h2><ol>'+latest.map(latestItem).join('')+'</ol></aside>';
    }
    html += '</div></div>';

    html += eventsBlock(sport);

    if(rest.length){
      html += '<section class="more"><div class="wrap"><div class="more-head"><h2 class="sec">Lisää juttuja</h2></div><div class="grid">'+rest.map(gridItem).join('')+'</div></div></section>';
    }
    main.innerHTML = html;
  }

  function article(id){
    var a = NEWS.filter(function(x){return x.id===id})[0];
    if(!a){
      renderNav(null);
      document.title = 'Juttua ei löytynyt – '+SITE;
      main.innerHTML = '<div class="wrap" style="padding:56px 0"><a class="back" href="#/">Etusivulle</a><div class="empty"><h3>Juttua ei löytynyt</h3><p>Juttu on voitu poistaa tai osoite on virheellinen.</p></div></div>';
      return;
    }
    renderNav(a.laji);
    document.title = a.otsikko+' – '+SITE;
    var paras = String(a.teksti||'').split(/\n{2,}/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
    var more = NEWS.filter(function(x){return x.id!==a.id}).slice(0,3);
    var html = '<div class="wrap"><article class="story">'+
      '<aside class="rv"><a class="back" href="#/">Etusivulle</a><dl>'+
        '<div><dt>Laji</dt><dd><a class="tag" href="#/laji/'+encodeURIComponent(a.laji)+'">'+esc(a.laji)+'</a></dd></div>'+
        '<div><dt>Julkaistu</dt><dd><time>'+fmt(a.pvm)+'</time></dd></div>'+
        (a.kirjoittaja?'<div><dt>Kirjoittaja</dt><dd>'+esc(a.kirjoittaja)+'</dd></div>':'')+
      '</dl></aside>'+
      '<div class="rv" style="--i:1"><h1>'+esc(a.otsikko)+'</h1>'+
        (a.ingressi?'<p class="ing">'+esc(a.ingressi)+'</p>':'')+
        media(a)+'<div class="body">'+paras+'</div></div>'+
    '</article></div>';
    if(more.length){
      html += '<section class="more"><div class="wrap"><div class="more-head"><h2 class="sec">Lue myös</h2></div><div class="grid">'+more.map(gridItem).join('')+'</div></div></section>';
    }
    main.innerHTML = html;
  }

  function route(first){
    var parts = location.hash.replace(/^#\/?/,'').split('/');
    if(!window.UUTISET){
      main.innerHTML = '<div class="wrap" style="padding:56px 0"><div class="empty"><h3>Uutisia ei voitu ladata</h3><p>Yritä hetken päästä uudelleen.</p></div></div>';
      return;
    }
    if(parts[0]==='juttu' && parts[1]) article(decodeURIComponent(parts[1]));
    else if(parts[0]==='laji' && parts[1]) home(decodeURIComponent(parts[1]));
    else home(null);
    if(!first){window.scrollTo(0,0);main.focus({preventScroll:true})}
  }

  renderTicker();
  window.addEventListener('hashchange',function(){route(false)});
  route(true);
})();
</script>
</body>
</html>
