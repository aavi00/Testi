<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Lappeenranta – paikalliset urheilu-uutiset</title>
<meta name="description" content="Uutisia, tuloksia ja tapahtumia Lappeenrannan urheilusta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F5F5; --text:#222222; --text2:#5A5A5A; --line:#DDDDDD;
  --accent:#0B7A4B; --on-accent:#FFFFFF; --bar:#161616; --bar-text:#F5F5F5;
  --t0:#0B7A4B; --t0t:#FFFFFF; --t1:#222222; --t1t:#FFFFFF; --t2:#E9E9E9; --t2t:#222222;
  --head:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",Arial,system-ui,sans-serif;
  --r:4px; --r2:6px; --t:200ms;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --text:#EDEDED; --text2:#ABABAB; --line:#333333;
    --accent:#3DDC97; --on-accent:#0B1A12; --bar:#000000; --bar-text:#EDEDED;
    --t0:#0B7A4B; --t2:#2A2A2A; --t2t:#EDEDED; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
a,button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{outline:none;min-height:60dvh}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}

/* Top bar + masthead */
.topbar{background:var(--bar);color:var(--bar-text);font-size:.8rem}
.topbar .wrap{display:flex;justify-content:space-between;gap:16px;padding:8px 0;flex-wrap:wrap}
.mast{padding:18px 0 14px}
.brand{display:inline-flex;align-items:center;gap:12px;min-height:44px}
.brand .mk{display:grid;place-items:center;width:44px;height:44px;background:var(--accent);color:var(--on-accent);font:800 1.15rem var(--head);border-radius:var(--r)}
.brand .nm{font:800 clamp(1.7rem,4.4vw,2.6rem)/1 var(--head);letter-spacing:-.02em}
.brand .nm span{color:var(--accent)}
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);border-bottom:2px solid var(--text)}
.sports{display:flex;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none;gap:2px}
.sports::-webkit-scrollbar{display:none}
.chip{display:block;white-space:nowrap;padding:12px 14px;font:600 .95rem/1 var(--body);min-height:44px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color var(--t),border-color var(--t),background var(--t)}
.chip:hover{border-bottom-color:var(--accent);color:var(--accent)}
.chip:active{transform:translateY(1px)}
.chip[aria-current="page"]{border-bottom-color:var(--accent);color:var(--accent);font-weight:700}

/* Shared */
.tag{display:inline-block;color:var(--accent);font:700 .72rem/1 var(--body);letter-spacing:.07em;text-transform:uppercase}
.meta{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:.8rem;color:var(--text2)}
.media{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:var(--r2);background:var(--surface)}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--t)}
a:hover .media img{transform:scale(1.03)}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px 14px}
.ph span{font:800 clamp(1.8rem,4vw,3rem)/.95 var(--head);letter-spacing:-.02em;text-transform:uppercase;overflow-wrap:anywhere;max-width:100%}
.t0{background:var(--t0);color:var(--t0t)}
.t1{background:var(--t1);color:var(--t1t)}
.t2{background:var(--t2);color:var(--t2t)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--text)}
.sec-h h2{font:800 1.15rem/1.1 var(--head);text-transform:uppercase;letter-spacing:.02em}
a.title{transition:color var(--t)}
a:hover .title,a.title:hover{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* Reveal */
.rv{animation:up .4s ease-out both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Layout */
.page{display:grid;gap:32px;padding:24px 0 56px}
@media (min-width:1000px){.page{grid-template-columns:minmax(0,1fr) 340px;gap:40px}}
.stack{display:grid;gap:28px;align-content:start}

/* Lead */
.lead a{display:block}
.lead .media{aspect-ratio:16/9}
.lead .ph span{font-size:clamp(2.4rem,7vw,5rem)}
.lead h2{font:800 clamp(1.7rem,3.6vw,2.7rem)/1.08 var(--head);margin:14px 0 10px;text-wrap:balance}
.lead p{margin:0;color:var(--text2);font-size:1.1rem;max-width:60ch}

/* Secondary */
.twin{display:grid;gap:24px}
@media (min-width:640px){.twin{grid-template-columns:1fr 1fr}}
.sec a{display:block}
.sec h3{font:700 1.3rem/1.15 var(--head);margin:10px 0 0;text-wrap:balance}
.sec .media{aspect-ratio:16/10}

/* List rows */
.rows{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--line)}
.row a{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:14px 0;min-height:44px;align-items:start}
@media (min-width:640px){.row a{grid-template-columns:132px 1fr}}
.row .media{aspect-ratio:4/3}
.row .ph{padding:8px 10px}
.row .ph span{font-size:1.1rem}
.row h3{font:700 1.1rem/1.2 var(--head);text-wrap:balance}
.row p{margin:4px 0 0;color:var(--text2);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row a:active{transform:translateY(1px)}

/* Sidebar boxes */
.box{background:var(--surface);border-radius:var(--r2);padding:16px}
.box .sec-h{border-bottom-width:1px;border-bottom-color:var(--line)}
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.res li:last-child{border-bottom:0}
.res .lj{grid-column:1/-1;font:700 .7rem/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.res .sc{font:800 1.15rem/1 var(--head);text-align:right;align-self:center}
.ev{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border-bottom:0}
.ev .d{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 0}
.ev .d b{font:800 1.4rem/1 var(--head)}
.ev .d span{font:600 .65rem/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-top:3px}
.ev h3{font:700 .98rem/1.2 var(--head)}
.ev p{margin:2px 0 0;font-size:.85rem;color:var(--text2)}
.note{margin:0;font-size:.92rem;color:var(--text2)}

/* Sport page head */
.phead{padding:24px 0 0}
.phead h1{font:800 clamp(2.2rem,6vw,3.6rem)/1 var(--head);letter-spacing:-.025em}
.phead p{margin:6px 0 0;color:var(--text2)}

/* Article */
.art h1{font:800 clamp(2rem,4.6vw,3.2rem)/1.06 var(--head);margin:8px 0 16px;text-wrap:balance}
.art .ing{font-size:1.25rem;line-height:1.45;font-weight:500;color:var(--text);margin:0 0 20px;max-width:60ch}
.art .info{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 20px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.88rem;color:var(--text2)}
.art .media{margin-bottom:24px}
.art .txt p{font-size:1.15rem;line-height:1.75;max-width:64ch;margin:0 0 1.15em}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:.92rem;color:var(--accent)}
.back:hover{text-decoration:underline}

/* States */
.empty{border:1px dashed var(--line);border-radius:var(--r2);padding:28px 22px;max-width:56ch}
.empty h3{font:800 1.4rem/1.1 var(--head);margin:0 0 6px}
.empty p{margin:0;color:var(--text2)}
.sk{background:linear-gradient(90deg,var(--surface) 0%,var(--line) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:var(--r2)}
@keyframes sh{to{background-position:-200% 0}}

footer{background:var(--bar);color:var(--bar-text);padding:36px 0 44px}
footer .wrap{display:grid;gap:14px}
@media (min-width:800px){footer .wrap{grid-template-columns:1fr auto;align-items:end}}
footer p{margin:0;color:#BDBDBD}
footer a.mail{display:inline-flex;align-items:center;min-height:44px;font:800 clamp(1.4rem,3.4vw,2.1rem)/1.1 var(--head);color:#fff;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:6px;word-break:break-word}
footer a.mail:hover{color:var(--accent)}
footer :focus-visible{outline-color:#3DDC97}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.sk{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap"><span>Paikalliset urheilu-uutiset</span><span id="today"></span></div></div>

<header>
  <div class="wrap mast">
    <a class="brand" href="#/" aria-label="Sport Lappeenranta, etusivu"><span class="mk" aria-hidden="true">SL</span><span class="nm">Sport <span>Lappeenranta</span></span></a>
  </div>
  <nav class="nav" aria-label="Lajit"><div class="wrap"><ul class="sports" id="sports"></ul></div></nav>
</header>

<main id="main" tabindex="-1" aria-busy="true">
  <div class="wrap page" aria-hidden="true">
    <div class="stack">
      <div class="sk" style="aspect-ratio:16/9"></div>
      <div class="sk" style="height:34px;width:80%"></div>
      <div class="sk" style="height:18px;width:60%"></div>
    </div>
    <div class="stack"><div class="sk" style="height:220px"></div><div class="sk" style="height:220px"></div></div>
  </div>
  <noscript><div class="wrap"><p>Sivu vaatii JavaScriptin toimiakseen.</p></div></noscript>
</main>

<footer>
  <div class="wrap">
    <div>
      <p>Onko sinulla vinkki tai tapahtuma, josta pitäisi kertoa?</p>
      <a class="mail" href="mailto:toimitus@esimerkki.fi">toimitus@esimerkki.fi</a>
    </div>
    <p>&copy; 2026 Sport Lappeenranta</p>
  </div>
</footer>

<script src="uutiset.js"></script>
<script>
(function(){
  var main = document.getElementById('main');
  var SITE = 'Sport Lappeenranta';
  var MONTHS = ['tammi','helmi','maalis','huhti','touko','kesä','heinä','elo','syys','loka','marras','joulu'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function fmt(iso){var p=String(iso).split('-');return (+p[2])+'.'+(+p[1])+'.'+p[0]}
  function short(iso){var p=String(iso).split('-');return (+p[2])+'.'+(+p[1])+'.'}
  function today(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
  function byDateDesc(a,b){return a.pvm<b.pvm?1:a.pvm>b.pvm?-1:0}
  function tone(s){var h=0;String(s).split('').forEach(function(c){h=(h*31+c.charCodeAt(0))%3});return 't'+h}

  try{document.getElementById('today').textContent=new Date().toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}

  var NEWS = (window.UUTISET||[]).slice().sort(byDateDesc);
  var EVENTS = (window.TAPAHTUMAT||[]).slice().sort(function(a,b){return a.pvm>b.pvm?1:-1});
  var RESULTS = (window.TULOKSET||[]).slice().sort(byDateDesc);

  function sportsList(){
    var set = {};
    NEWS.forEach(function(a){if(a.laji)set[a.laji]=1});
    EVENTS.forEach(function(e){if(e.laji)set[e.laji]=1});
    return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'fi')});
  }

  function media(a,extra){
    if(a.kuva) return '<div class="media"><img src="'+esc(a.kuva)+'" alt="" loading="lazy"></div>';
    return '<div class="media '+tone(a.laji)+'"><div class="ph" aria-hidden="true"><span>'+esc(extra||a.laji)+'</span></div></div>';
  }

  function renderNav(active){
    var items = ['<li><a class="chip" href="#/"'+(active?'':' aria-current="page"')+'>Etusivu</a></li>'];
    sportsList().forEach(function(s){
      items.push('<li><a class="chip" href="#/laji/'+encodeURIComponent(s)+'"'+(active===s?' aria-current="page"':'')+'>'+esc(s)+'</a></li>');
    });
    document.getElementById('sports').innerHTML = items.join('');
  }

  function metaLine(a){return '<div class="meta"><span class="tag">'+esc(a.laji)+'</span><time>'+short(a.pvm)+'</time></div>'}

  function rowItem(a,i){
    return '<li class="row rv" style="--i:'+(i%6)+'"><a href="#/juttu/'+esc(a.id)+'">'+media(a,String(a.laji).slice(0,3))+
      '<div>'+metaLine(a)+'<h3 class="title">'+esc(a.otsikko)+'</h3>'+(a.ingressi?'<p>'+esc(a.ingressi)+'</p>':'')+'</div></a></li>';
  }

  function resultsBox(sport){
    var list = RESULTS.filter(function(r){return !sport||r.laji===sport}).slice(0,6);
    if(!list.length) return '';
    return '<section class="box rv" style="--i:2" aria-labelledby="rh"><div class="sec-h"><h2 id="rh">Tulokset</h2></div><ul class="res">'+list.map(function(r){
      return '<li><span class="lj">'+esc(r.laji)+'</span><span>'+esc(r.koti)+' &ndash; '+esc(r.vieras)+'</span><span class="sc">'+esc(r.tulos)+'</span></li>';
    }).join('')+'</ul></section>';
  }

  function eventsBox(sport){
    var t = today();
    var list = EVENTS.filter(function(e){return e.pvm>=t && (!sport||e.laji===sport)}).slice(0,6);
    var inner = list.length ? list.map(function(e){
      var p = e.pvm.split('-');
      return '<div class="ev"><div class="d"><b>'+(+p[2])+'</b><span>'+MONTHS[+p[1]-1]+'</span></div><div><h3>'+esc(e.nimi)+'</h3><p>'+esc([e.laji,e.aika,e.paikka].filter(Boolean).join(' · '))+'</p></div></div>';
    }).join('') : '<p class="note">Ei tulevia tapahtumia. Uudet tapahtumat ilmestyvät tähän, kun ne on lisätty.</p>';
    return '<section class="box rv" style="--i:3" aria-labelledby="eh"><div class="sec-h"><h2 id="eh">Tulevat tapahtumat</h2></div>'+inner+'</section>';
  }

  function sidebar(sport){return '<aside class="stack" aria-label="Tulokset ja tapahtumat">'+resultsBox(sport)+eventsBox(sport)+'</aside>'}

  function home(sport){
    var list = sport ? NEWS.filter(function(a){return a.laji===sport}) : NEWS;
    renderNav(sport||null);
    document.title = sport ? sport+' – '+SITE : SITE+' – paikalliset urheilu-uutiset';
    var html = '';
    if(sport) html += '<div class="wrap phead rv"><h1>'+esc(sport)+'</h1><p>'+list.length+' '+(list.length===1?'juttu':'juttua')+'</p></div>';
    else html += '<h1 class="sr">'+SITE+' – uutiset</h1>';

    var main1;
    if(!list.length){
      main1 = '<div class="empty"><h3>Ei vielä uutisia</h3><p>'+(sport?'Tähän lajiin':'Sivulle')+' ei ole vielä lisätty juttuja. Palaa pian.</p></div>';
    } else {
      var lead = list[0], twin = list.slice(1,3), rest = list.slice(3);
      main1 = '<article class="lead rv" style="--i:1"><a href="#/juttu/'+esc(lead.id)+'">'+media(lead)+
        '<h2 class="title">'+esc(lead.otsikko)+'</h2><div class="meta" style="margin-top:0"><span class="tag">'+esc(lead.laji)+'</span><time>'+fmt(lead.pvm)+'</time></div>'+
        (lead.ingressi?'<p>'+esc(lead.ingressi)+'</p>':'')+'</a></article>';
      if(twin.length){
        main1 += '<div class="twin">'+twin.map(function(a,i){
          return '<article class="sec rv" style="--i:'+(i+2)+'"><a href="#/juttu/'+esc(a.id)+'">'+media(a)+'<h3 class="title">'+esc(a.otsikko)+'</h3><div class="meta" style="margin:6px 0 0"><span class="tag">'+esc(a.laji)+'</span><time>'+short(a.pvm)+'</time></div></a></article>';
        }).join('')+'</div>';
      }
      if(rest.length){
        main1 += '<section aria-labelledby="mh"><div class="sec-h"><h2 id="mh">Lisää juttuja</h2></div><ul class="rows">'+rest.map(rowItem).join('')+'</ul></section>';
      }
    }
    html += '<div class="wrap page"><div class="stack">'+main1+'</div>'+sidebar(sport)+'</div>';
    main.innerHTML = html;
  }

  function article(id){
    var a = NEWS.filter(function(x){return x.id===id})[0];
    if(!a){
      renderNav(null);
      document.title = 'Juttua ei löytynyt – '+SITE;
      main.innerHTML = '<div class="wrap page"><div class="stack"><a class="back" href="#/">&larr; Etusivulle</a><div class="empty"><h3>Juttua ei löytynyt</h3><p>Juttu on voitu poistaa tai osoite on virheellinen.</p></div></div>'+sidebar(null)+'</div>';
      return;
    }
    renderNav(a.laji);
    document.title = a.otsikko+' – '+SITE;
    var paras = String(a.teksti||'').split(/\n{2,}/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
    var more = NEWS.filter(function(x){return x.id!==a.id}).slice(0,4);
    var html = '<div class="wrap page"><div class="stack"><article class="art rv">'+
      '<a class="back" href="#/">&larr; Etusivulle</a>'+
      '<div><a class="tag" href="#/laji/'+encodeURIComponent(a.laji)+'">'+esc(a.laji)+'</a></div>'+
      '<h1>'+esc(a.otsikko)+'</h1>'+
      (a.ingressi?'<p class="ing">'+esc(a.ingressi)+'</p>':'')+
      '<div class="info"><span>Julkaistu <time>'+fmt(a.pvm)+'</time></span>'+(a.kirjoittaja?'<span>Kirjoittaja: '+esc(a.kirjoittaja)+'</span>':'')+'</div>'+
      media(a)+'<div class="txt">'+paras+'</div></article>'+
      (more.length?'<section aria-labelledby="mh"><div class="sec-h"><h2 id="mh">Lue myös</h2></div><ul class="rows">'+more.map(rowItem).join('')+'</ul></section>':'')+
      '</div>'+sidebar(a.laji)+'</div>';
    main.innerHTML = html;
  }

  function route(first){
    var parts = location.hash.replace(/^#\/?/,'').split('/');
    if(!window.UUTISET){
      main.innerHTML = '<div class="wrap page"><div class="empty"><h3>Uutisia ei voitu ladata</h3><p>Yritä hetken päästä uudelleen. Jos vika toistuu, tarkista, että uutiset.js on ladattu samaan kansioon.</p></div></div>';
      main.removeAttribute('aria-busy');
      return;
    }
    if(parts[0]==='juttu' && parts[1]) article(decodeURIComponent(parts[1]));
    else if(parts[0]==='laji' && parts[1]) home(decodeURIComponent(parts[1]));
    else home(null);
    main.removeAttribute('aria-busy');
    if(!first){window.scrollTo(0,0);main.focus({preventScroll:true})}
  }

  window.addEventListener('hashchange',function(){route(false)});
  route(true);
})();
</script>
</body>
</html>
